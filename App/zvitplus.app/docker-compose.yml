services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: zvitplus-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Password123!"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zvitplus-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5267
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=ZvitPlus;User Id=sa;Password=YourStrong@Password123!;Encrypt=True;TrustServerCertificate=True;"
      DataStorage__BasePath: "/app/Storage"
    ports:
      - "5267:5267"
    volumes:
      - storage_data:/app/Storage

  web:
    build:
      context: ./zvitplus.app
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5267/api
    container_name: zvitplus-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  sql_data:
  storage_data:
